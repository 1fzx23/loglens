[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "1.0.0"
description = "轻量级日志分析工具：多格式自动识别、统计、错误模式聚类、过滤、HTML 报告（零依赖）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "1fzx23" }]
keywords = ["log", "log-analysis", "cli", "nginx", "syslog", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: System :: Logging",
    "Topic :: Text Processing",
]

[project.scripts]
loglens = "loglens.loglens:main"

[tool.setuptools]
packages = ["loglens"]
